<h1>
Application Status
</h1>


<input id="id"
placeholder="AAP-APP-00001">


<button onclick="checkStatus()">
Check
</button>


<div id="result"></div>



<script>

async function checkStatus(){


const id =
document.getElementById(
"id"
).value;



const response =
await fetch(

"http://localhost:5000/api/status/"
+
id

);



const data =
await response.json();



document.getElementById(
"result"
).innerHTML=

`

<h3>
${data.name}
</h3>


<p>
Status:
${data.status}
</p>


<p>
${data.note || ""}
</p>


`;


}

</script>
