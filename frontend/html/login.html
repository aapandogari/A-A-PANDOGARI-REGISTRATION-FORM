<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
AAP Admin Login
</title>


<link rel="stylesheet" href="../css/login.css">


</head>



<body>



<div class="login-container">



<div class="login-box">



<img 
src="/logo/logo.png" 
class="login-logo"
alt="AAP Logo">



<h1>
AL-AWWAL PANDOGARI ECOSYSTEM
</h1>



<h2>
Admin Login
</h2>





<form id="loginForm">


<input
type="text"
id="email"
placeholder="Admin Username or Email"
required>



<input

type="password"

id="password"

placeholder="Password"

required>





<button type="submit">

LOGIN

</button>



</form>



</div>



</div>





<script src="../js/login.js"></script>



</body>


</html>
